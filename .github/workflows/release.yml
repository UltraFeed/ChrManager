name: Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Read version and reject existing tag
        id: version
        shell: pwsh
        run: |
          $version = dotnet msbuild src/ChrManager.csproj -getProperty:Version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse --verify --quiet "refs/tags/v$version"
          if ($LASTEXITCODE -eq 0) { throw "Tag v$version already exists" }
          "value=$version" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Publish standalone native executable
        shell: pwsh
        run: |
          dotnet publish src/ChrManager.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "v$env:RELEASE_VERSION" --target $env:RELEASE_SHA --title "ChrManager $env:RELEASE_VERSION" --generate-notes tmp/bin/release/ChrManager.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
