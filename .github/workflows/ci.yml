name: CodeQL

on:
  push:
  pull_request:

jobs:
  analyze:
    name: Analyze and Build
    runs-on: windows-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['csharp']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: Publish native executables
        shell: pwsh
        run: |
          dotnet msbuild src/ChrManager.csproj -t:PublishRelease
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ChrManager-Windows
          path: |
            tmp/bin/release/ChrManager-win-x64.exe
            tmp/bin/release/ChrManager-win-arm64.exe
          if-no-files-found: error
          retention-days: 30
