name: CodeQL
'on':
  push: null
  pull_request: null
jobs:
  analyze:
    name: Analyze and Build
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - csharp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
      - name: Verify formatting
        run: dotnet format --verify-no-changes --severity info
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: autobuild
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
      - name: Publish native executable
        shell: pwsh
        run: |
          dotnet publish src/ChrManager.csproj -c Release
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ChrManager-Windows
          path: tmp/bin/release/ChrManager.exe
          if-no-files-found: error
          retention-days: 30
